<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Your shared organization inbox, powered by Nexa."><title>Inbox · Nexa Mail</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mail.css"><script src="app.js" defer></script></head>
<body>
  <aside id="preview-bar" class="preview-bar" hidden><strong>Preview</strong><span>Sample mail · No email delivery</span><button id="reset-preview" type="button">Reset preview</button></aside>
  <header class="topbar"><a class="brand" href="./"><span class="brand-icon">n</span>nexa <span>mail</span></a><label class="search"><input type="search" placeholder="Search mail" aria-label="Search mail"></label><span id="identity" class="muted"></span></header>
  <div class="layout">
    <aside class="sidebar"><button class="compose" id="compose"><span aria-hidden="true">+</span>Compose</button><nav aria-label="Mail folders"><button class="selected" data-folder="Inbox">Inbox</button><button data-folder="Starred">Starred</button><button data-folder="Sent">Sent</button><button data-folder="Drafts">Drafts</button><button data-folder="Archive">Archive</button><button data-folder="Trash">Trash</button></nav><div class="section-label">RECEIVING ADDRESSES</div><nav id="addresses" aria-label="Receiving addresses"></nav></aside>
    <main class="inbox"><div class="inbox-heading"><h1>Inbox</h1><button id="sync">Refresh &amp; sync</button></div><p id="error" role="alert" hidden></p><div class="toolbar"><label><input type="checkbox" id="unread"> Unread only</label><span id="count"></span><button id="previous" aria-label="Previous page">‹</button><button id="next" aria-label="Next page">›</button></div><div id="messages" aria-live="polite"></div><p id="sync-status" class="inbox-footer">Loading mailbox…</p></main>
  </div>
  <dialog id="message-dialog" aria-labelledby="message-title"><div class="dialog-heading"><h2 id="message-title"></h2><button type="button" data-close aria-label="Close message">×</button></div><p id="message-sender"></p><p id="message-auth" class="muted"></p><nav id="thread" aria-label="Conversation messages"></nav><div id="message-content"></div><div id="attachments"></div><footer id="message-actions"></footer></dialog>
  <dialog id="compose-dialog" aria-labelledby="compose-title"><form id="compose-form"><div class="dialog-heading"><h2 id="compose-title">New message</h2><button type="button" data-close aria-label="Close draft">×</button></div><label>From<input name="from" type="email" required maxlength="254"></label><div id="sender-choices" class="sender-choices"></div><label>To<input name="to" type="email" required maxlength="254"></label><label>Subject<input name="subject" required maxlength="998"></label><label>Message<textarea name="text" rows="10" required maxlength="200000"></textarea></label><label>Attachments<input name="files" type="file" multiple><span class="muted">Up to 10 files, 512 KiB combined.</span></label><div id="draft-attachments"></div><p id="draft-status" role="status"></p><p id="draft-error" role="alert" hidden></p><footer><button type="button" id="delete-draft">Delete draft</button><button type="button" id="save-draft">Save draft</button><button type="submit" class="primary">Send</button></footer></form></dialog>
  <div class="toast" role="status" hidden></div>
</body></html>
